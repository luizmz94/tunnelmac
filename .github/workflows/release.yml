# Builds, signs, notarizes and packages a release on a GitHub-hosted Mac and uploads it as
# a draft GitHub release. Manual only (workflow_dispatch) and limited to main by the
# `release` environment: pull requests never reach these secrets.
# The draft is published by hand after review; the tap is updated with scripts/update-tap.py.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and notarize without creating the draft release.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      # the runner context only exists inside steps
      - run: |
          echo "KEYCHAIN=$RUNNER_TEMP/tunnelmac-release.keychain-db" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Toolchain
        run: |
          swift --version
          xcrun --show-sdk-version
          brew install openfortivpn gitleaks

      # The full graphical suite: hosted macOS runners have a logged-in session.
      - name: Full suite
        run: ./scripts/test.sh

      - name: Shared publication preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_REPORT: ${{ env.OUTPUT_DIR }}/TestResults.txt
        run: ./scripts/publication-preflight.sh

      # Own keychain, outside the search list; passwords only reach security/notarytool.
      - name: Temporary keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set +x -eu
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::Set the APPLE_TEAM_ID variable of the release environment.'; exit 1; }
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          umask 077
          p12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security import "$p12" -k "$KEYCHAIN" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          # codesign only finds identities in the search list; restored in the cleanup.
          security list-keychains -d user -s "$KEYCHAIN" $(tr -d '"' < "$RUNNER_TEMP/keychains-before")
          xcrun notarytool store-credentials tunnelmac-ci --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN" > /dev/null
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" |
            sed -nE "s/^ *[0-9]+\) ([0-9A-F]{40}) \"Developer ID Application: .+ \($TEAM_ID\)\"$/\1/p")
          [ "$(printf '%s\n' "$identity" | grep -c .)" = 1 ] || { echo "::error::Expected one Developer ID Application of $TEAM_ID in the keychain."; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign, notarize and package
        run: |
          set -eu
          SIGNING_KEYCHAIN="$KEYCHAIN" ./scripts/build.sh
          NOTARY_PROFILE=tunnelmac-ci NOTARY_KEYCHAIN="$KEYCHAIN" ./scripts/notarize.sh "$OUTPUT_DIR/TunnelMac.app"
          ./scripts/package-release.sh "$OUTPUT_DIR/TunnelMac.app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 7

      # A draft creates no tag; publishing the draft creates it on this commit.
      - name: Draft release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          release=$(sed -n 's/.*static let releaseVersion = "\(.*\)".*/\1/p' Sources/VPNHelperShared/Constants.swift)
          if gh release view "v$release" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$release already exists."; exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$release" > /dev/null; then
            echo "::error::Tag v$release already exists."; exit 1
          fi
          prerelease=()
          [[ "$release" != *-* ]] || prerelease=(--prerelease)
          gh release create "v$release" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft ${prerelease[@]+"${prerelease[@]}"} \
            --title "TunnelMac $release" --notes-file packaging/release-notes.md \
            "$RELEASE_DIR/TunnelMac-$release-arm64.zip" "$RELEASE_DIR/SHA256SUMS"

      # Removes the keychain even when the job fails and checks the search list is restored.
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            security list-keychains -d user -s $(tr -d '"' < "$RUNNER_TEMP/keychains-before")
          fi
          security delete-keychain "$KEYCHAIN" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12"
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            diff "$RUNNER_TEMP/keychains-before" <(security list-keychains -d user)
            rm -f "$RUNNER_TEMP/keychains-before"
          fi
